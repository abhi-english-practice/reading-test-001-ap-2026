<!doctype html>

  <title>POP APTIS TEST | Reading - Women Mathematicians</title>
  <style>
    :root{

    button{cursor:pointer}

    .progress-wrap{min-width:0}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:.75rem;color:#ddd;margin-bottom:5px}.progress{height:8px;border-radius:99px;background:#454545;overflow:hidden}.progress>span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--yellow),var(--coral));transition:.35s}
    .top-actions{display:flex;gap:8px}.icon-btn{border:1px solid #555;background:#242424;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800}.icon-btn:hover{border-color:var(--yellow)}
    .hero{max-width:1240px;margin:28px auto 20px;padding:0 20px}
    .hero-card{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:30px;padding:38px;box-shadow:var(--shadow)}
    .hero-card:after{content:"READING";position:absolute;right:-18px;bottom:-45px;font-size:clamp(4rem,12vw,10rem);font-weight:1000;color:rgba(255,255,255,.055);letter-spacing:-.08em;line-height:1}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--ink);padding:7px 12px;border-radius:999px;font-size:.78rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase}
    h1{max-width:850px;margin:18px 0 10px;font-size:clamp(2rem,5vw,4.8rem);line-height:.95;letter-spacing:-.055em}
    .layout{max-width:1240px;margin:auto;padding:0 20px 70px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
    .sidebar{position:sticky;top:82px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
    .side-title{font-size:.72rem;font-weight:950;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;padding:5px 8px 12px}
    .nav-btn{width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:14px;color:var(--ink);margin:2px 0}
    .nav-btn:hover,.nav-btn.active{background:#f0eadf}.nav-btn.active .nav-num{background:var(--ink);color:var(--yellow)}
    .nav-num{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:11px;font-weight:950}.nav-copy strong{display:block;font-size:.91rem}.nav-copy small{color:var(--muted)}.nav-score{font-size:.78rem;font-weight:900;color:var(--muted)}
    .side-summary{margin-top:14px;padding:15px;border-radius:16px;background:var(--ink);color:#fff}.side-summary small{color:#aaa}.side-summary .big{font-size:2rem;line-height:1;font-weight:1000;color:var(--yellow);margin:5px 0}
    .side-submit{width:100%;margin-top:10px;border:0;border-radius:13px;background:var(--yellow);color:var(--ink);font-weight:950;padding:12px}
    .content{min-width:0}.module{display:none}.module.active{display:block;animation:rise .28s ease}@keyframes rise{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
    .module-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px}.module-kicker{font-size:.76rem;font-weight:950;letter-spacing:.17em;color:var(--coral);text-transform:uppercase}.module h2{margin:4px 0 0;font-size:clamp(1.75rem,4vw,2.7rem);letter-spacing:-.045em;line-height:1}.module-instruction{max-width:600px;color:var(--muted);margin:10px 0 0}.level{flex:none;background:var(--ink);color:#fff;border-radius:999px;padding:8px 12px;font-size:.78rem;font-weight:900}.level span{color:var(--yellow)}
    .question-card,.reading-card,.order-shell,.passage-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(30,25,18,.055);margin:0 0 15px;overflow:hidden}
    .question-card{padding:20px}.q-top{display:flex;gap:12px;align-items:flex-start}.q-number{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--yellow);font-weight:1000}.q-main{min-width:0;flex:1}.question{font-size:1.05rem;font-weight:800;margin:4px 0 15px}.blank{display:inline-block;min-width:68px;border-bottom:3px solid var(--coral);color:transparent;line-height:1}
    .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.option{position:relative}.option input{position:absolute;opacity:0}.option label{display:flex;gap:9px;align-items:center;height:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff;transition:.18s;font-weight:750}.option label:before{content:attr(data-letter);display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:8px;background:#eee8de;font-size:.78rem;font-weight:950}.option input:checked+label{border-color:var(--blue);box-shadow:0 0 0 3px rgba(71,104,255,.1);background:#f7f8ff}.option input:checked+label:before{background:var(--blue);color:#fff}
    .question-card.correct{border-color:#83cfb7}.question-card.correct .q-number{background:var(--green);color:#fff}.question-card.wrong{border-color:#ef9b92}.question-card.wrong .q-number{background:var(--red);color:#fff}
    .feedback{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:15px}.checked .feedback{display:block}.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.75rem;font-weight:950}.badge.good{background:#dff6ed;color:#0e684d}.badge.bad{background:#ffe2df;color:#9b271f}.answer-line{font-weight:900}.translation{border-left:4px solid var(--yellow);padding:9px 12px;background:#faf5e8;border-radius:0 10px 10px 0;margin:10px 0}.translation .en{font-weight:850}.translation .vi{color:#5e584e;margin-top:3px}
    .explain-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.explain-box{background:#f3eee5;border-radius:14px;padding:13px}.explain-box h4{margin:0 0 6px;font-size:.73rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.explain-box p{margin:0;font-size:.92rem}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:750}.chip b{color:var(--blue)}
    .part-actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 12px}.primary,.secondary,.danger{border-radius:14px;padding:12px 16px;font-weight:950}.primary{border:0;background:var(--ink);color:#fff}.primary:hover{background:#2d2d2d}.secondary{border:1px solid var(--line);background:var(--card);color:var(--ink)}.danger{border:1px solid #e3a19b;background:#fff5f4;color:var(--red)}
    .order-shell{padding:18px}.logic-note{background:#fff7d1;border:1px solid #ead166;border-radius:15px;padding:13px 15px;margin-bottom:14px;font-size:.9rem}.order-board{display:grid;grid-template-columns:1fr 1fr;gap:14px}.order-column{min-width:0;border:1px solid var(--line);border-radius:18px;background:#f8f4ec;padding:13px}.order-column h3{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 4px;font-size:1rem}.order-column h3 span{color:var(--muted);font-size:.78rem}.order-help{display:block;color:var(--muted);font-size:.78rem;margin-bottom:10px}.order-bank,.order-list{display:grid;gap:9px}.order-item{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;transition:.18s;cursor:pointer;color:var(--ink)}.order-item:hover{border-color:var(--blue);transform:translateY(-1px)}.order-item.selected{border-color:#8aa0ff;background:#eef1ff;color:#6c6c70}.order-item.selected .position{background:var(--blue);color:#fff}.position{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#eee8de;font-weight:1000}.sentence{font-weight:750}.order-item.correct-pos{border-color:#70cbb0;background:#f1fbf7}.order-item.wrong-pos{border-color:#e99a91;background:#fff7f6}.order-empty{display:grid;place-items:center;min-height:86px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.84rem;text-align:center;padding:14px}.order-complete{color:var(--green)!important}
    .order-result{display:none;margin-top:16px}.order-shell.checked .order-result{display:block}.sequence{display:grid;gap:9px}.sequence-row{display:grid;grid-template-columns:33px 1fr;gap:10px;padding:11px;border-radius:13px;background:#f3eee5}.sequence-row .seq{font-weight:1000;color:var(--coral)}.sequence-row .en{font-weight:800}.sequence-row .vi{color:var(--muted);font-size:.9rem}.why{font-size:.85rem;color:#555;margin-top:4px}.why b{color:var(--blue)}
    .passage-card{padding:0}.passage-letter{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--ink);color:#fff}.passage-letter span{display:grid;place-items:center;width:34px;height:34px;background:var(--yellow);color:var(--ink);border-radius:10px;font-weight:1000}.passage-letter strong{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase}.passage-text{padding:18px;font-size:.98rem}.passage-vi{padding:13px;border-radius:13px;background:#f2ede4;color:#555}
    .match-card{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:11px}.match-row{display:grid;grid-template-columns:42px 1fr 170px;gap:12px;align-items:center}.statement{font-weight:850}.select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-weight:800}.match-card.correct{border-color:#78cdb3;background:#f3fbf8}.match-card.wrong{border-color:#e99a91;background:#fff7f6}.match-feedback{display:none;margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}.match-card.checked .match-feedback{display:block}.evidence{font-size:.9rem}.evidence strong{color:var(--blue)}
    .headings{background:var(--ink);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:15px}.headings h3{margin:0 0 12px}.heading-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.heading-option{border:1px solid #444;border-radius:12px;padding:9px 11px;color:#ddd;font-size:.88rem}.heading-option b{color:var(--yellow);margin-right:7px}
    .reading-card{padding:20px}.reading-top{display:grid;grid-template-columns:42px 1fr 190px;gap:12px;align-items:start}.paragraph{font-size:.98rem}.reading-card.correct{border-color:#78cdb3;background:#f5fcf9}.reading-card.wrong{border-color:#e99a91;background:#fff8f7}.reading-feedback{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}.reading-card.checked .reading-feedback{display:block}
    .post-study{display:none}.module.checked .post-study{display:block}.vocab-bank{margin-top:22px;background:#efe7d9;border:1px solid var(--line);border-radius:var(--radius);padding:19px}.vocab-bank h3{margin:0 0 12px}.vocab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.vocab-item{background:var(--card);border-radius:13px;padding:11px}.vocab-item strong{display:block;color:var(--blue)}.vocab-item small{color:var(--muted)}
    .result-panel{display:none}.result-panel.active{display:block}.result-hero{background:var(--ink);color:#fff;border-radius:28px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.result-hero h2{margin:0 0 7px}.result-score{display:grid;place-items:center;width:138px;height:138px;border-radius:50%;border:12px solid var(--yellow);font-size:2.15rem;font-weight:1000}.result-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.result-part{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}.result-part b{display:block;font-size:1.35rem}.review-list{display:grid;gap:10px}.review-item{background:#fff8f7;border:1px solid #ebaaa4;border-radius:15px;padding:13px}.review-item strong{color:var(--red)}
    .mobile-nav{display:none;margin:0 0 15px}.mobile-nav select{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:12px;font-weight:900}
    .toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border:1px solid #444;border-radius:14px;padding:11px 16px;box-shadow:var(--shadow);font-weight:850;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    footer{max-width:1240px;margin:auto;padding:0 20px 35px;color:var(--muted);font-size:.82rem;text-align:center}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:block}.topbar-inner{grid-template-columns:auto 1fr}.top-actions{display:none}.hero-card{padding:28px}.module-head{align-items:flex-start}.level{display:none}.match-row,.reading-top{grid-template-columns:40px 1fr}.match-row select,.reading-top select{grid-column:2}.result-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.order-board{grid-template-columns:1fr}}
    @media(max-width:620px){.topbar-inner{padding:10px 14px}.brand-text{display:none}.hero{margin-top:18px;padding:0 12px}.hero-card{padding:24px;border-radius:22px}.layout{padding:0 12px 50px}.options{grid-template-columns:1fr}.explain-grid,.heading-grid,.vocab-grid{grid-template-columns:1fr}.order-item{grid-template-columns:34px 1fr}.result-hero{grid-template-columns:1fr}.result-score{width:116px;height:116px}.module h2{font-size:1.75rem}.question-card{padding:16px}.passage-text{padding:15px}.result-grid{grid-template-columns:1fr 1fr}}
    @media print{.topbar,.sidebar,.mobile-nav,.part-actions,.toast{display:none!important}.hero{margin:0}.hero-card{box-shadow:none}.layout{display:block;padding-bottom:0}.module{display:block!important;break-before:page}.feedback,.order-result,.match-feedback,.reading-feedback,.post-study{display:block!important}.question-card,.reading-card,.order-shell,.passage-card{box-shadow:none;break-inside:avoid}.result-panel{display:none!important}}
  </style>

<body>
  <header class="topbar">

        <div class="progress-meta"><span id="progressText">0/29 questions answered</span><span id="progressPercent">0%</span></div>
        <div class="progress"><span id="progressBar"></span></div>
      </div>
      <div class="top-actions"><button class="icon-btn" id="showResultTop">Score</button><button class="icon-btn" id="resetTop">Reset</button></div>

  <section class="hero">
    <div class="hero-card">
      <span class="eyebrow">Reading Dossier · Version 4</span>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-title">Reading modules</div>

      <div class="side-summary"><small>TOTAL SCORE</small><div class="big"><span id="sideScore">--</span>/29</div><small id="sideBand">Not submitted</small><button class="side-submit" id="submitAll">Submit all</button></div>
    </aside>

      <div class="mobile-nav"><select id="mobileModule" aria-label="Choose a test part"></select></div>

        <div class="result-hero"><div><span class="eyebrow">Score dossier</span><h2>Reading Results</h2><p id="resultMessage">Complete the test to view your analysis.</p></div><div class="result-score" id="resultScore">0/29</div></div>
        <div class="result-grid" id="resultGrid"></div>
        <div class="part-actions"><button class="secondary" id="backToTest">Back to test</button><button class="danger" id="resetResult">Reset test</button></div>

      </section>

  </main>
  <footer>POP APTIS TEST · Reading Practice Edition</footer>
  <div class="toast" id="toast"></div>

  <script>
    const part1 = [
      {q:'The ______ is out.',opts:['wind','dust','sun'],a:2,full:'The sun is out.',vi:'Mặt trời đã ló ra / Trời đã nắng.',why:'“The sun is out” là cách nói tự nhiên khi mặt trời xuất hiện và trời đang có nắng. “Wind” và “dust” không đi với cấu trúc này trong ngữ cảnh thời tiết thông thường.',coll:['the sun is out = trời có nắng','come out = xuất hiện'],vocab:['sun /sʌn/ = mặt trời','weather = thời tiết']},
      {q:'I have an ______ holiday.',opts:['tired','enjoyable','good'],a:1,full:'I have an enjoyable holiday.',vi:'Tôi có một kỳ nghỉ thú vị / đáng tận hưởng.',why:'Chỗ trống đứng trước danh từ “holiday” nên cần tính từ. “Enjoyable” diễn tả điều mang lại niềm vui; “tired” mô tả người bị mệt. “Good” đúng ngữ pháp nhưng “enjoyable” là đáp án đích, cụ thể hơn về trải nghiệm.',coll:['an enjoyable holiday = kỳ nghỉ thú vị','have a holiday = có kỳ nghỉ'],vocab:['enjoyable /ɪnˈdʒɔɪ.ə.bəl/ = thú vị','holiday = kỳ nghỉ']},
      {q:'After ______ so hard.',opts:['working','sleeping','eating'],a:0,full:'After working so hard, you deserve a rest.',vi:'Sau khi làm việc rất chăm chỉ, bạn xứng đáng được nghỉ ngơi.',why:'Sau giới từ “after”, động từ dùng dạng V-ing. Cụm “work hard” tạo nghĩa hợp lý nhất. Câu nguồn là một mệnh đề rút gọn; bản đầy đủ được bổ sung để dễ hiểu.',coll:['after + V-ing = sau khi làm gì','work hard = làm việc chăm chỉ'],vocab:['deserve a rest = xứng đáng nghỉ ngơi','hard = chăm chỉ']},
      {q:'I hope to ______ your letter.',opts:['tell','read','forward'],a:1,full:'I hope to read your letter.',vi:'Tôi hy vọng sẽ đọc thư của bạn.',why:'“Hope to + V” cần động từ nguyên mẫu. Ta “read a letter” (đọc thư). “Tell a letter” sai kết hợp từ; “forward a letter” là chuyển tiếp thư nhưng không phù hợp ý định được kiểm tra.',coll:['hope to do something = hy vọng làm gì','read a letter = đọc thư'],vocab:['forward = chuyển tiếp','letter = thư']},
      {q:'The water is ______.',opts:['sour','clear','see'],a:1,full:'The water is clear.',vi:'Nước trong.',why:'Sau động từ nối “is” cần tính từ. “Clear” là tính từ tự nhiên để mô tả nước trong; “see” là động từ, còn “sour” thường tả vị chua.',coll:['clear water = nước trong','crystal-clear water = nước trong vắt'],vocab:['clear /klɪə(r)/ = trong','sour = chua']}
    ];

    const orderParts = {
      2:{title:'Family Sports Day',subtitle:'Tap the sentences in the correct order to build a complete paragraph.',initial:['p2s1','p2s2','p2s3','p2s4','p2s5'],correct:['p2s3','p2s5','p2s2','p2s4','p2s1'],items:{
        p2s1:{en:'After the games, the kids were really hungry and ate with their parents.',vi:'Sau các trò chơi, bọn trẻ rất đói và ăn cùng bố mẹ.',why:'“After the games” khép lại chuỗi hoạt động, nên câu này đứng cuối.',key:'after the games; be hungry; eat with somebody'},
        p2s2:{en:"After she got her prize, the next part was for children's activities.",vi:'Sau khi cô ấy nhận giải, phần tiếp theo dành cho các hoạt động của trẻ em.',why:'“She” quay lại Ms Kamus ở câu trước; “the next part” mở phần hoạt động trẻ em.',key:'get a prize; the next part; activities for children'},
        p2s3:{en:'It took place on Sunday morning in the park, there was a race for adults.',vi:'Sự kiện diễn ra vào sáng Chủ nhật trong công viên; có một cuộc đua dành cho người lớn.',why:'Câu giới thiệu thời gian, địa điểm và hoạt động đầu tiên nên mở đoạn.',key:'take place; on Sunday morning; a race for adults'},
        p2s4:{en:'The activities were football, swimming, skipping, and more, and the kids had fun playing together.',vi:'Các hoạt động gồm bóng đá, bơi, nhảy dây và nhiều hoạt động khác; bọn trẻ vui vẻ chơi cùng nhau.',why:'“The activities” cụ thể hóa “children’s activities” ở câu trước.',key:'have fun + V-ing; play together; children’s activities'},

      3:{title:'Movies Then and Now',subtitle:'Use linking words and cause-effect relationships to order the sentences.',initial:['p3s1','p3s2','p3s3','p3s4','p3s5'],correct:['p3s3','p3s1','p3s5','p3s2','p3s4'],items:{
        p3s1:{en:'In the old days, films were only in black and white, and sometimes even without sound.',vi:'Ngày xưa, phim chỉ có màu đen trắng, đôi khi thậm chí không có âm thanh.',why:'“In the old days” bắt đầu phần mô tả quá khứ sau câu chủ đề.',key:'in the old days; black and white; without sound'},

    const passages = {
      A:{en:"We were playing in a band and we finished our performance in the morning. However, I stayed at the festival to meet up with some old band mates. We talked a lot. However, I didn’t like the venue. It was too crowded and not well organised. The road to the tent village was also congested. I think they should choose a better location next year.",vi:'Chúng tôi biểu diễn trong một ban nhạc và hoàn thành phần trình diễn vào buổi sáng. Tuy nhiên, tôi ở lại lễ hội để gặp vài người bạn cũ trong ban nhạc. Chúng tôi trò chuyện rất nhiều. Dù vậy, tôi không thích địa điểm tổ chức vì quá đông và thiếu tổ chức. Con đường tới khu lều cũng ùn tắc. Tôi nghĩ năm sau họ nên chọn địa điểm tốt hơn.'},
      B:{en:"I really enjoyed the music of this festival and I danced to the music; I felt every second of the festival was worth it. I absolutely loved the energy of the performances, and the music was spot on throughout the weekend. However, I have to say the ticket prices were far too high, especially for students. I paid almost double what I did two years ago, and although I enjoyed the music, I’m not sure it offered good value for money. If they don’t lower the prices next year, a lot of people might skip it.",vi:'Tôi thực sự thích âm nhạc của lễ hội và đã nhảy theo nhạc; tôi cảm thấy từng giây đều đáng giá. Tôi vô cùng thích năng lượng của các màn biểu diễn và âm nhạc xuất sắc suốt cuối tuần. Tuy nhiên, giá vé quá cao, nhất là với sinh viên. Tôi trả gần gấp đôi so với hai năm trước; dù thích âm nhạc, tôi không chắc lễ hội đáng đồng tiền. Nếu năm sau họ không giảm giá, nhiều người có thể bỏ qua.'},
      C:{en:"I’ve been to this festival a couple of times in the past; the quality was good the last times I came, but this time is completely different. The sound quality wasn’t great, and the whole event just felt disorganised. There weren’t enough facilities, and the staff didn’t seem prepared to handle the crowd. I couldn’t even interact with the band. I don’t think I’ll be coming back next year. It’s simply not worth the money or the time anymore.",vi:'Tôi từng đến lễ hội này vài lần; những lần trước chất lượng tốt nhưng lần này hoàn toàn khác. Âm thanh không hay và toàn bộ sự kiện có vẻ lộn xộn. Không có đủ cơ sở vật chất, nhân viên dường như chưa sẵn sàng xử lý đám đông. Tôi thậm chí không thể tương tác với ban nhạc. Tôi không nghĩ năm sau mình sẽ quay lại; nó không còn đáng tiền hay thời gian.'},
      D:{en:"This was my first time attending the Music Festival, and to be honest, the weather really didn’t cooperate. It rained heavily on the first two days, which made it difficult to enjoy the outdoor activities. I still got wet in the tent. But I didn’t let that ruin the experience. On the final day, the skies cleared up and the performances were truly amazing - especially the final act in the evening. That last day made it all worthwhile, and I left with some great memories despite the poor weather.",vi:'Đây là lần đầu tôi tham dự Lễ hội Âm nhạc và thời tiết thực sự không thuận lợi. Hai ngày đầu mưa lớn khiến các hoạt động ngoài trời khó tận hưởng; tôi vẫn bị ướt trong lều. Nhưng tôi không để điều đó phá hỏng trải nghiệm. Ngày cuối trời quang và các màn biểu diễn thật tuyệt vời, nhất là tiết mục cuối buổi tối. Ngày cuối khiến tất cả trở nên xứng đáng và tôi ra về với những kỷ niệm đẹp dù thời tiết xấu.'}

    const part5 = [
      {a:'A',p:'For centuries, the achievements of women in mathematics were either omitted from historical records or attributed to male colleagues. Hypatia of Alexandria, one of the earliest known female mathematicians, was respected in her time, yet many of her contributions were later credited to male scholars. Such erasure has been a recurring theme in the history of women in this field.',vi:'Trong nhiều thế kỷ, thành tựu của phụ nữ trong toán học hoặc bị bỏ khỏi sử liệu, hoặc bị gán cho đồng nghiệp nam. Hypatia thành Alexandria, một trong những nữ toán học gia sớm nhất được biết tới, được kính trọng vào thời của bà, nhưng nhiều đóng góp sau đó lại được ghi cho các học giả nam. Sự xóa mờ như vậy là mô-típ lặp lại trong lịch sử phụ nữ ở lĩnh vực này.',why:'Các từ khóa “omitted”, “attributed to male colleagues” và “erasure” đều nói thành tựu phụ nữ bị giới tính làm lu mờ.',e:'achievements ... were either omitted ... or attributed to male colleagues',coll:['omit from historical records','attribute A to B','credit contributions to somebody']},
      {a:'B',p:'Emmy Noether, often described as the most important woman in the history of mathematics, revolutionized abstract algebra and theoretical physics. Albert Einstein referred to her work as “the very expression of the spirit of modern algebra.” Only recently has her legacy gained the widespread recognition it deserves, demonstrating a growing effort to acknowledge those once overlooked.',vi:'Emmy Noether, thường được mô tả là người phụ nữ quan trọng nhất trong lịch sử toán học, đã cách mạng hóa đại số trừu tượng và vật lý lý thuyết. Albert Einstein coi công trình của bà là biểu hiện tinh túy của tinh thần đại số hiện đại. Chỉ gần đây di sản của bà mới nhận được sự công nhận rộng rãi xứng đáng, cho thấy nỗ lực ngày càng lớn nhằm ghi nhận những người từng bị bỏ quên.',why:'Trọng tâm không chỉ là thành tựu mà là việc di sản của một người tiên phong cuối cùng được “widespread recognition”.',e:'her legacy gained the widespread recognition it deserves',coll:['revolutionize a field','gain widespread recognition','acknowledge those overlooked']},
      {a:'C',p:'In many historical accounts, the success of male mathematicians has overshadowed the collaborative efforts of their female peers. For example, the development of chaos theory often credits Edward Lorenz, yet contributions by female mathematicians working in the same field are frequently omitted from textbooks and academic narratives.',vi:'Trong nhiều ghi chép lịch sử, thành công của các nhà toán học nam đã lấn át nỗ lực hợp tác của đồng nghiệp nữ. Chẳng hạn, sự phát triển của lý thuyết hỗn loạn thường ghi công Edward Lorenz, trong khi đóng góp của các nữ toán học gia cùng lĩnh vực thường bị bỏ khỏi sách giáo khoa và các tường thuật học thuật.',why:'Đoạn đối lập việc nam giới được “credits” với đóng góp nữ giới bị “omitted”, đúng ý ghi công thiếu công bằng.',e:'credits Edward Lorenz, yet contributions by female mathematicians ... are frequently omitted',coll:['overshadow collaborative efforts','credit somebody','academic narratives']},
      {a:'D',p:'Mary Cartwright had a mathematical career spanning over six decades. Her work in nonlinear differential equations laid the groundwork for chaos theory, influencing both mathematics and engineering. Despite the challenges faced by women in academia during her time, she maintained a consistent output of high-quality research throughout her life.',vi:'Mary Cartwright có sự nghiệp toán học kéo dài hơn sáu thập kỷ. Công trình về phương trình vi phân phi tuyến của bà đặt nền móng cho lý thuyết hỗn loạn, ảnh hưởng tới cả toán học và kỹ thuật. Dù phụ nữ trong giới học thuật thời đó gặp nhiều thách thức, bà vẫn duy trì đều đặn các nghiên cứu chất lượng cao suốt cuộc đời.',why:'“Spanning over six decades” thể hiện sự nghiệp dài; “high-quality research” thể hiện năng lực xuất chúng.',e:'a mathematical career spanning over six decades',coll:['span over six decades','lay the groundwork for','maintain a consistent output']},
      {a:'E',p:'When female mathematicians are described as “women geniuses” or “female prodigies,” the gender label, while well-intended, often implies that excellence is rare among women. Such terms, though celebratory, can unintentionally reinforce the idea that women’s success in mathematics is unusual, rather than simply the result of talent and hard work.',vi:'Khi các nữ toán học gia được gọi là “nữ thiên tài” hay “thần đồng nữ”, nhãn giới tính dù có thiện ý thường ngụ ý rằng sự xuất sắc ở phụ nữ là hiếm. Những cách gọi có vẻ tôn vinh này có thể vô tình củng cố quan niệm rằng thành công của phụ nữ trong toán học là bất thường, thay vì đơn thuần là kết quả của tài năng và nỗ lực.',why:'Toàn đoạn phân tích cách nhãn “female/women” làm thay đổi nhận thức về năng lực và thành công.',e:'the gender label ... can unintentionally reinforce the idea',coll:['a well-intended label','reinforce the idea','the result of talent and hard work']},
      {a:'F',p:'To address the gender imbalance in mathematics, many universities and organizations now run outreach programs, offer scholarships specifically for women, and encourage female mentorship in STEM fields. These efforts aim not to give unfair advantage, but to create equal opportunities in a domain where women have historically been underrepresented.',vi:'Để giải quyết mất cân bằng giới trong toán học, nhiều trường đại học và tổ chức hiện triển khai chương trình tiếp cận cộng đồng, cấp học bổng riêng cho phụ nữ và khuyến khích cố vấn nữ trong STEM. Những nỗ lực này không nhằm tạo lợi thế bất công mà nhằm tạo cơ hội bình đẳng trong lĩnh vực mà phụ nữ vốn ít được đại diện.',why:'“Address the gender imbalance” và “create equal opportunities” trực tiếp khớp với nỗ lực tạo cân bằng giới.',e:'To address the gender imbalance ... create equal opportunities',coll:['address a gender imbalance','run outreach programs','create equal opportunities']},
      {a:'G',p:'In efforts to level the playing field, some institutions have implemented standardized criteria for admissions or research evaluation. However, such uniform methods can sometimes ignore the diverse paths and challenges faced by individuals, particularly women balancing academic and societal expectations. A one-size-fits-all approach may not always foster true equity.',vi:'Trong nỗ lực tạo sân chơi bình đẳng, một số tổ chức áp dụng tiêu chí chuẩn hóa cho tuyển sinh hoặc đánh giá nghiên cứu. Tuy nhiên, phương pháp đồng nhất có thể bỏ qua những con đường và thách thức đa dạng của từng cá nhân, đặc biệt là phụ nữ phải cân bằng kỳ vọng học thuật và xã hội. Cách tiếp cận “một khuôn cho tất cả” không phải lúc nào cũng nuôi dưỡng công bằng thực chất.',why:'Câu cuối kết luận rõ: cách tiếp cận đồng loạt không phải lúc nào cũng tạo ra công bằng thật sự.',e:'A one-size-fits-all approach may not always foster true equity.',coll:['level the playing field','standardized criteria','a one-size-fits-all approach','foster true equity']}
    ];

    function renderPart1(){return `<section class="module active" data-module="1">${moduleHead(1,'Sentence Completion','Choose the best word to complete each sentence.','A2-B1')}<div>${part1.map((x,i)=>`<article class="question-card" id="p1q${i}"><div class="q-top"><div class="q-number">${i+1}</div><div class="q-main"><div class="question">${x.q.replace('______','<span class="blank">blank</span>')}</div><div class="options">${x.opts.map((o,j)=>`<div class="option"><input type="radio" name="p1q${i}" id="p1q${i}o${j}" value="${j}"><label data-letter="${String.fromCharCode(65+j)}" for="p1q${i}o${j}">${esc(o)}</label></div>`).join('')}</div><div class="feedback"><div class="verdict"><span class="badge"></span><span class="answer-line">Answer: ${x.opts[x.a]}</span></div><div class="translation"><div class="en">${x.full}</div><div class="vi"><b>Dịch:</b> ${x.vi}</div></div><div class="explain-grid"><div class="explain-box"><h4>Giải thích đáp án</h4><p>${x.why}</p></div><div class="explain-box"><h4>Từ vựng và cụm từ quan trọng</h4><div class="chips">${x.coll.concat(x.vocab).map(c=>`<span class="chip">${c}</span>`).join('')}</div></div></div></div></div></div></article>`).join('')}</div><div class="part-actions"><button class="primary" data-check="1">Check Part 1</button><button class="secondary" data-next="2">Go to Part 2 →</button></div></section>`}
    function renderOrderPart(id){const p=orderParts[id];return `<section class="module" data-module="${id}">${moduleHead(id,p.title,p.subtitle,'B1-B2')}<div class="order-shell" id="orderShell${id}"><div class="logic-note"><b>How to answer:</b> Tap the sentences in the order you want. Tap a selected sentence again to remove it from your answer.</div><div class="order-board"><div class="order-column"><h3>Sentence bank <span>Tap to select</span></h3><small class="order-help">Selected sentences are highlighted.</small><div class="order-bank" id="orderBank${id}"></div></div><div class="order-column"><h3>Your order <span id="orderCount${id}">0/5</span></h3><small class="order-help">The first sentence you choose becomes number 1.</small><div class="order-list" id="orderList${id}"></div></div></div><div class="order-result"><h3>Correct sequence</h3><div class="sequence">${p.correct.map((key,i)=>{const x=p.items[key];return `<div class="sequence-row"><div class="seq">${i+1}</div><div><div class="en">${x.en}</div><div class="vi"><b>Dịch:</b> ${x.vi}</div><div class="why"><b>Giải thích:</b> ${x.why}</div><div class="chips"><span class="chip"><b>Cụm từ:</b> ${x.key}</span></div></div></div>`}).join('')}</div></div></div><div class="part-actions"><button class="primary" data-check="${id}">Check Part ${id}</button><button class="secondary" data-next="${id+1}">Go to Part ${id+1} →</button></div></section>`}
    function renderPassages(){return Object.entries(passages).map(([k,p])=>`<article class="passage-card" id="passage${k}"><div class="passage-letter"><span>${k}</span><strong>Paragraph ${k}</strong></div><div class="passage-text">${p.en}</div></article>`).join('')}
    function renderPart4(){return `<section class="module" data-module="4">${moduleHead(4,'Music Festival','Read paragraphs A-D and match each statement to the correct paragraph. You may use a paragraph more than once.','B1-B2')}<div>${renderPassages()}</div><h3>Statements</h3><div>${part4.map((x,i)=>`<article class="match-card" id="p4q${i}"><div class="match-row"><div class="q-number">${i+1}</div><div><div class="statement">${x.s}</div></div><select class="select" id="p4s${i}"><option value="">Choose A-D...</option>${['A','B','C','D'].map(v=>`<option>${v}</option>`).join('')}</select></div><div class="match-feedback"><div class="verdict"><span class="badge"></span><span class="answer-line">Answer: Paragraph ${x.a}</span></div><div class="evidence"><strong>Bằng chứng:</strong> ${x.e}<br><strong>Dịch bằng chứng:</strong> ${x.ev}</div><div class="chips"><span class="chip"><b>Cụm từ:</b> ${x.key}</span></div></div></article>`).join('')}</div><div class="post-study"><div class="vocab-bank"><h3>Bản dịch các đoạn văn</h3>${Object.entries(passages).map(([k,p])=>`<div class="passage-vi"><b>Đoạn ${k}:</b> ${p.vi}</div>`).join('')}</div></div><div class="part-actions"><button class="primary" data-check="4">Check Part 4</button><button class="secondary" data-next="5">Go to Part 5 →</button></div></section>`}
    function headingSelect(i){return `<select class="select" id="p5s${i}"><option value="">Choose a heading...</option>${headings.map(h=>`<option value="${h.id}">${h.id}. ${h.en}</option>`).join('')}</select>`}
    function renderPart5(){return `<section class="module" data-module="5">${moduleHead(5,'Women Mathematicians','Match each paragraph with the most suitable heading. There are two extra headings.','B2-C1')}<div class="headings" id="headingBox"><h3>Heading bank</h3><div class="heading-grid">${headings.map(h=>`<div class="heading-option"><b>${h.id}</b>${h.en}</div>`).join('')}</div></div><div>${part5.map((x,i)=>`<article class="reading-card" id="p5q${i}"><div class="reading-top"><div class="q-number">${i+1}</div><div class="paragraph">${x.p}</div>${headingSelect(i)}</div><div class="reading-feedback"><div class="verdict"><span class="badge"></span><span class="answer-line">Answer: ${x.a}. ${headings.find(h=>h.id===x.a).en}</span></div><div class="translation"><div class="vi"><b>Dịch đoạn văn:</b> ${x.vi}</div><div class="vi"><b>Dịch heading:</b> ${headings.find(h=>h.id===x.a).vi}</div></div><div class="explain-grid"><div class="explain-box"><h4>Giải thích đáp án</h4><p>${x.why}</p><p style="margin-top:8px"><b>Bằng chứng:</b> “${x.e}”</p></div><div class="explain-box"><h4>Cụm từ quan trọng</h4><div class="chips">${x.coll.map(c=>`<span class="chip">${c}</span>`).join('')}</div></div></div></div></article>`).join('')}</div><div class="post-study"><div class="vocab-bank"><h3>Từ vựng trọng tâm</h3><div class="vocab-grid">${[
      ['omit /əˈmɪt/','bỏ sót, lược bỏ'],['attribute A to B','quy A cho là do/thuộc về B'],['pioneer /ˌpaɪəˈnɪə(r)/','người tiên phong'],['legacy /ˈleɡəsi/','di sản'],['overshadow','làm lu mờ'],['lay the groundwork for','đặt nền móng cho'],['prodigy /ˈprɒdədʒi/','thần đồng'],['well-intended','có thiện ý'],['underrepresented','ít được đại diện'],['outreach programme','chương trình tiếp cận cộng đồng'],['equity /ˈekwəti/','công bằng thực chất'],['uniform criteria','tiêu chí đồng nhất']
      ].map(v=>`<div class="vocab-item"><strong>${v[0]}</strong><small>${v[1]}</small></div>`).join('')}</div></div></div><div class="part-actions"><button class="primary" data-check="5">Check Part 5</button><button class="secondary" id="finishTest">View Score Dossier ★</button></div></section>`}

    function render(){document.getElementById('sideNav').innerHTML=navHTML();document.getElementById('mobileModule').innerHTML=moduleMeta.map(m=>`<option value="${m.id}">Part ${m.id} - ${m.title}</option>`).join('')+`<option value="result">Score Dossier</option>`;document.getElementById('modules').innerHTML=renderPart1()+renderOrderPart(2)+renderOrderPart(3)+renderPart4()+renderPart5();renderOrder(2);renderOrder(3);bind();updateProgress()}
    function renderOrder(id){const p=orderParts[id],bank=document.getElementById('orderBank'+id),list=document.getElementById('orderList'+id),count=document.getElementById('orderCount'+id);bank.innerHTML=p.initial.map((key,i)=>{const chosen=state.order[id].includes(key);return `<button class="order-item ${chosen?'selected':''}" data-order-key="${key}" data-id="${id}" aria-pressed="${chosen}"><span class="position">${chosen?'✓':String.fromCharCode(65+i)}</span><span class="sentence">${p.items[key].en}</span></button>`}).join('');list.innerHTML=state.order[id].length?state.order[id].map((key,i)=>`<button class="order-item answer-item" data-order-key="${key}" data-id="${id}" title="Tap to remove"><span class="position">${i+1}</span><span class="sentence">${p.items[key].en}</span></button>`).join(''):'<div class="order-empty">Your selected sequence will appear here.</div>';count.textContent=`${state.order[id].length}/5`;count.classList.toggle('order-complete',state.order[id].length===5);if(state.checked[id])markOrder(id)}
    function bind(){
      document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
      document.getElementById('mobileModule').onchange=e=>go(e.target.value);
      document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>go(b.dataset.next));
      document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>checkPart(+b.dataset.check));
      document.querySelectorAll('input[type=radio],select.select').forEach(el=>el.onchange=updateProgress);
      document.getElementById('submitAll').onclick=submitAll;document.getElementById('showResultTop').onclick=()=>go('result');document.getElementById('finishTest').onclick=submitAll;
      document.getElementById('backToTest').onclick=()=>go(5);document.getElementById('resetTop').onclick=resetAll;document.getElementById('resetResult').onclick=resetAll;
      bindOrderOnly(2);bindOrderOnly(3);
    }
    function bindOrderOnly(id){document.querySelectorAll(`#orderBank${id} [data-order-key],#orderList${id} [data-order-key]`).forEach(b=>b.onclick=()=>chooseOrder(+b.dataset.id,b.dataset.orderKey))}
    function chooseOrder(id,key){const index=state.order[id].indexOf(key);if(index>=0)state.order[id].splice(index,1);else if(state.order[id].length<5)state.order[id].push(key);state.checked[id]=false;state.scores[id]=0;document.getElementById('orderShell'+id).classList.remove('checked');document.querySelector(`[data-module="${id}"]`).classList.remove('checked');renderOrder(id);bindOrderOnly(id);updateProgress()}
    function go(target){state.active=target==='result'?'result':+target;document.querySelectorAll('.module').forEach(m=>m.classList.toggle('active',+m.dataset.module===state.active));document.getElementById('resultPanel').classList.toggle('active',state.active==='result');document.getElementById('modules').style.display=state.active==='result'?'none':'';document.getElementById('sideNav').innerHTML=navHTML();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.getElementById('mobileModule').value=String(state.active);if(state.active==='result')buildResults();window.scrollTo({top:document.querySelector('.layout').offsetTop-75,behavior:'smooth'})}
    function setVerdict(card,ok){card.classList.remove('correct','wrong');card.classList.add('checked',ok?'correct':'wrong');const badge=card.querySelector('.badge');if(badge){badge.className='badge '+(ok?'good':'bad');badge.textContent=ok?'✓ Correct':'✕ Not quite'}}
    function checkPart(id){let score=0;if(id===1){part1.forEach((x,i)=>{const card=document.getElementById('p1q'+i);const hit=document.querySelector(`input[name="p1q${i}"]:checked`);const ok=hit&&+hit.value===x.a;if(ok)score++;setVerdict(card,ok)})}else if(id===2||id===3){score=orderParts[id].correct.reduce((n,x,i)=>n+(state.order[id][i]===x),0);document.getElementById('orderShell'+id).classList.add('checked');markOrder(id)}else if(id===4){part4.forEach((x,i)=>{const card=document.getElementById('p4q'+i);const ok=document.getElementById('p4s'+i).value===x.a;if(ok)score++;setVerdict(card,ok)})}else if(id===5){part5.forEach((x,i)=>{const card=document.getElementById('p5q'+i);const ok=document.getElementById('p5s'+i).value===x.a;if(ok)score++;setVerdict(card,ok)})}state.scores[id]=score;state.checked[id]=true;document.querySelector(`[data-module="${id}"]`).classList.add('checked');document.getElementById('navScore'+id)?.replaceChildren(document.createTextNode(score+'/'+moduleMeta[id-1].count));updateProgress();toast(`Part ${id}: ${score}/${moduleMeta[id-1].count}`)}
    function markOrder(id){document.querySelectorAll(`#orderList${id} .order-item`).forEach((el,i)=>{el.classList.remove('correct-pos','wrong-pos');el.classList.add(state.order[id][i]===orderParts[id].correct[i]?'correct-pos':'wrong-pos')})}
    function attempted(){let n=0;part1.forEach((_,i)=>{if(document.querySelector(`input[name="p1q${i}"]:checked`))n++});n+=state.order[2].length+state.order[3].length;part4.forEach((_,i)=>{if(document.getElementById('p4s'+i)?.value)n++});part5.forEach((_,i)=>{if(document.getElementById('p5s'+i)?.value)n++});return n}
    function updateProgress(){const n=attempted(),pct=Math.round(n/29*100);document.getElementById('progressText').textContent=`${n}/29 questions answered`;document.getElementById('progressPercent').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';const checked=Object.values(state.checked).every(Boolean);if(checked){const total=Object.values(state.scores).reduce((a,b)=>a+b,0);document.getElementById('sideScore').textContent=total;document.getElementById('sideBand').textContent=band(total).label}}
    function submitAll(){[1,2,3,4,5].forEach(checkPart);buildResults();go('result')}
    function band(total){const p=total/29;if(p>=.86)return{label:'C1 · Excellent control',msg:'Rất tốt. Anh/chị kiểm soát vững liên kết đoạn, paraphrase và collocations.'};if(p>=.7)return{label:'B2 · Strong reader',msg:'Khá tốt. Hãy xem lại các câu sai để củng cố dấu hiệu nối ý và paraphrase.'};if(p>=.5)return{label:'B1 · Developing',msg:'Nền tảng ổn. Nên học lại cụm từ trọng tâm và làm lại hai phần sắp xếp.'};return{label:'A2 · Needs drilling',msg:'Nên đọc bản dịch song ngữ, học key collocations rồi reset làm lại.'}}
    function buildResults(){const total=Object.values(state.scores).reduce((a,b)=>a+b,0),b=band(total);document.getElementById('resultScore').textContent=total+'/29';document.getElementById('resultMessage').textContent=b.label+' — '+b.msg;document.getElementById('resultGrid').innerHTML=moduleMeta.map(m=>`<div class="result-part"><small>PART ${m.id}</small><b>${state.scores[m.id]}/${m.count}</b><span>${m.task}</span></div>`).join('');const wrong=[];
      part1.forEach((x,i)=>{const v=document.querySelector(`input[name="p1q${i}"]:checked`)?.value;if(+v!==x.a)wrong.push(`<div class="review-item"><strong>Part 1 · Câu ${i+1}</strong><div>${x.full}</div><small>${x.vi} · KEY: ${x.coll[0]}</small></div>`)});
      [2,3].forEach(id=>orderParts[id].correct.forEach((key,i)=>{if(state.order[id][i]!==key)wrong.push(`<div class="review-item"><strong>Part ${id} · Vị trí ${i+1}</strong><div>Đúng: ${orderParts[id].items[key].en}</div><small>${orderParts[id].items[key].vi}</small></div>`)}));
      part4.forEach((x,i)=>{if(document.getElementById('p4s'+i)?.value!==x.a)wrong.push(`<div class="review-item"><strong>Part 4 · Câu ${i+1}</strong><div>${x.s} → Paragraph ${x.a}</div><small>${x.key}</small></div>`)});
      part5.forEach((x,i)=>{if(document.getElementById('p5s'+i)?.value!==x.a)wrong.push(`<div class="review-item"><strong>Part 5 · Đoạn ${i+1}</strong><div>${x.a}. ${headings.find(h=>h.id===x.a).en}</div><small>${headings.find(h=>h.id===x.a).vi}</small></div>`)});
      document.getElementById('reviewList').innerHTML=wrong.length?wrong.join(''):'<div class="vocab-bank"><h3>Perfect score!</h3><p>Không có câu sai. Hãy dùng Vocabulary Bank ở Part 5 để ôn lại collocations.</p></div>'}
    function resetAll(){if(!confirm('Reset all answers and start again?'))return;location.reload()}
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
    render();
  </script>
</body>
</html>
